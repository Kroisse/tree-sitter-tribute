[package]
name = "tree-sitter-tribute"
description = "This is not the greatest language in the world, no. This is just a tribute."
version = "0.6.1"
authors = ["Eunchong Yu <kroisse@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "tribute"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/Kroisse/tree-sitter-tribute"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.5"
